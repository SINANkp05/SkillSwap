<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign Up | SkillSwap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }
        .auth-card {
            width: 100%;
            max-width: 500px;
            padding: 3rem 2.5rem;
            border-top: 2px solid rgba(8, 145, 178, 0.4);
            text-align: center;
        }
        .auth-logo { font-size: 2rem; margin-bottom: 2rem; display: inline-flex; text-decoration: none; }
        .auth-card h2 { font-size: 2rem; margin-bottom: 0.5rem; }
        .auth-card > p { color: var(--text-muted); margin-bottom: 2rem; }
        .row { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .row .form-group { margin-bottom: 0; flex: 1; }
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #cbd5e1; font-size: 0.95rem; }
        .form-input {
            width: 100%;
            background: rgba(20, 20, 30, 0.6);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            color: white;
            font-family: var(--font-body);
            font-size: 1rem;
            transition: all var(--transition-fast);
            outline: none;
            box-sizing: border-box;
        }
        .form-input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.2);
            background: rgba(20, 20, 30, 0.8);
        }
        .auth-btn {
            width: 100%;
            margin-top: 1rem;
            padding: 14px;
            font-size: 1.1rem;
            background: linear-gradient(135deg, var(--secondary), #0ea5e9);
            box-shadow: 0 4px 15px rgba(8, 145, 178, 0.3);
            border: none;
        }
        .auth-btn:hover { box-shadow: 0 8px 25px rgba(8, 145, 178, 0.5); filter: brightness(1.1); }
        .auth-footer { margin-top: 2rem; color: var(--text-muted); font-size: 0.95rem; }
        .auth-footer a { color: var(--secondary); font-weight: 600; }
        .bg-shape { z-index: 0; }
    </style>
</head>

<body>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div class="auth-container">
        <div class="auth-card glass-panel fade-in">
            <a href="index.html" class="logo auth-logo">
                <i class="fa-solid fa-people-arrows"></i> Skill<span>Swap</span>
            </a>
            <h2>Join SkillSwap</h2>
            <p>Trade skills, solve problems, and grow together.</p>

            <form id="signupForm">
                <div class="row">
                    <div class="form-group">
                        <label for="fname">First Name</label>
                        <input type="text" id="fname" class="form-input" placeholder="Alex" required>
                    </div>
                    <div class="form-group">
                        <label for="lname">Last Name</label>
                        <input type="text" id="lname" class="form-input" placeholder="Chen" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-toggle">
                        <input type="password" id="password" class="form-input" placeholder="Create a strong password" required autocomplete="new-password">
                        <i class="fa-solid fa-eye pwd-toggle" id="pwdToggle"></i>
                    </div>
                    <div class="password-strength" id="strengthMeter">
                        <div class="strength-bar-track"><div class="strength-bar-fill" id="strengthFill"></div></div>
                        <span class="strength-label" id="strengthLabel">Enter a password</span>
                    </div>
                </div>

                <div style="text-align: left; margin-bottom: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
                    By signing up, you agree to our <a href="#" style="color: var(--secondary);">Terms of Service</a>
                    and <a href="#" style="color: var(--secondary);">Privacy Policy</a>.
                </div>

                <button type="submit" class="btn btn-primary auth-btn" id="signupBtn">
                    <i class="fa-solid fa-user-plus"></i> Create Free Account
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        function showToast(message, type = 'info', duration = 3500) {
            const container = document.getElementById('toast-container');
            const iconMap = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info', warning: 'fa-triangle-exclamation' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fa-solid ${iconMap[type] || iconMap.info} toast-icon"></i><span class="toast-msg">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 400);
            }, duration);
        }

        // Password strength meter
        const pwdInput = document.getElementById('password');
        const strengthMeter = document.getElementById('strengthMeter');
        const strengthLabel = document.getElementById('strengthLabel');
        const levels = ['strength-weak', 'strength-fair', 'strength-good', 'strength-strong'];
        const labelTexts = ['Weak', 'Fair', 'Good', 'Strong 🔒'];

        pwdInput.addEventListener('input', () => {
            const val = pwdInput.value;
            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            levels.forEach(l => strengthMeter.classList.remove(l));
            if (val.length === 0) {
                strengthLabel.textContent = 'Enter a password';
                return;
            }
            const lvl = Math.min(score - 1, 3);
            strengthMeter.classList.add(levels[lvl]);
            strengthLabel.textContent = labelTexts[lvl];
        });

        // Password show/hide
        const pwdToggle = document.getElementById('pwdToggle');
        pwdToggle.addEventListener('click', () => {
            const isHidden = pwdInput.type === 'password';
            pwdInput.type = isHidden ? 'text' : 'password';
            pwdToggle.className = `fa-solid ${isHidden ? 'fa-eye-slash' : 'fa-eye'} pwd-toggle`;
        });

        // Signup form
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const first_name = document.getElementById('fname').value.trim();
            const last_name = document.getElementById('lname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = pwdInput.value;
            const btn = document.getElementById('signupBtn');

            if (password.length < 6) {
                showToast('Password must be at least 6 characters.', 'warning');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating account...';

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ first_name, last_name, email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    showToast(`Welcome to SkillSwap, ${first_name}! 🚀 Redirecting to login...`, 'success', 2500);
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else {
                    showToast(data.error || 'Registration failed. Please try again.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Free Account';
                }
            } catch (err) {
                showToast('Could not connect to server. Is it running?', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Free Account';
            }
        });
    </script>
</body>

</html>
