<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page Not Found | SkillSwap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-page-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        .error-code {
            font-size: 8rem;
            font-family: var(--font-heading);
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            line-height: 1;
            text-shadow: 0 10px 30px rgba(var(--accent-glow), 0.3);
        }

        .error-message {
            font-size: 2rem;
            color: white;
            margin-bottom: 1rem;
        }

        .error-description {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 500px;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        
        .floating-icon {
            font-size: 4rem;
            color: var(--border-color);
            position: absolute;
            animation: float 6s ease-in-out infinite;
            z-index: 0;
        }
        
        .icon-1 { top: 20%; left: 20%; animation-delay: 0s; }
        .icon-2 { top: 60%; right: 20%; animation-delay: -2s; font-size: 3rem; }
        .icon-3 { bottom: 20%; left: 30%; animation-delay: -4s; font-size: 5rem; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
    </style>
</head>

<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    
    <i class="fa-solid fa-code floating-icon icon-1"></i>
    <i class="fa-solid fa-palette floating-icon icon-2"></i>
    <i class="fa-solid fa-compass floating-icon icon-3"></i>

    <div class="error-page-container fade-in">
        <h1 class="error-code">404</h1>
        <h2 class="error-message">Lost in the Skills Matrix?</h2>
        <p class="error-description">The page you're looking for doesn't exist or has been moved. Let's get you back to finding your next skill swap.</p>
        <div style="display: flex; gap: 1rem;">
            <a href="dashboard.html" class="btn btn-primary btn-large">
                <i class="fa-solid fa-house"></i> Back to Dashboard
            </a>
            <a href="index.html#discover" class="btn btn-secondary btn-large">
                <i class="fa-solid fa-magnifying-glass"></i> Discover Users
            </a>
        </div>
    </div>
</body>

</html>
